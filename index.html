  <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" integrity="sha384-hStSInNIZ8ljtOVrmrgf7zdHMapaLBWoSnPTtF0nzsybp4+LuhDz6sHuEVpWIX8o" crossorigin="anonymous"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
      font-family:var(--app-font,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif)}
    html{--app-font:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app, #app button, #app select, #app input, #app textarea, #app h2, #app h3,
    .ctrl-btn, .mode-btn, .flip-btn, #aspect-btn, #fps, #toast, #settings-modal { font-family: inherit !important; }
    #app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;background:#000;transition:background-color .2s linear}

    #fps{position:fixed;top:10px;left:12px;z-index:40;font-size:11px;font-weight:400;color:rgba(255,255,255,.45);letter-spacing:.2px;pointer-events:none;font-family:inherit}
    #fps .fps-main{color:rgba(255,255,255,.9)}
    #fps .fps-detail{opacity:.58;font-weight:400}
    #fps.advanced-hidden{display:none}
    #app.recording-active #fps.advanced-hidden{display:none!important}

    #stage{position:relative;width:min(calc(100vw - 160px), calc(88vh * 16 / 9));height:min(calc((100vw - 160px) * 9 / 16), 88vh);background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    #camera-frame{position:relative;background:#111;overflow:hidden;border-radius:10px;width:100%;height:100%;transition:width .22s ease,height .22s ease,opacity .18s ease,transform .18s ease}
    #camera-frame.mode-switching{opacity:.5;transform:scale(0.98)}
    #video-wrap{width:100%;height:100%;overflow:hidden;position:relative;isolation:isolate}
    #video{width:100%;height:100%;object-fit:cover;display:block;background:#000;transform-origin:center center;contain:layout style;will-change:transform}
    #filter-overlay{position:absolute;inset:0;z-index:1;pointer-events:none}
    #temp-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:#fff;mix-blend-mode:soft-light;transition:opacity .06s linear}
    #canvas,#rec-canvas{display:none}

    #no-camera{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#4a4a4a;z-index:10}
    #no-camera.hidden{display:none}
    #no-camera .nc-icon{width:72px;height:72px;opacity:.85;position:relative}
    #no-camera .nc-icon svg{width:72px;height:72px}

    #countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:50;font-size:clamp(90px,18vw,140px);font-weight:200;color:#fff}
    #countdown.show{display:flex}

    #rec-timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:500;color:#fff;background:rgba(0,0,0,.55);padding:5px 14px;border-radius:20px;z-index:20;display:none;font-variant-numeric:tabular-nums}
    #rec-timer.recording{color:#ff3b30}

    #qr-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:15;display:none;white-space:nowrap}
    #zoom-label{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:500;color:rgba(255,255,255,.8);z-index:35;pointer-events:none;letter-spacing:.3px;display:none;text-shadow:0 1px 3px rgba(0,0,0,.45)}

    #shutter-flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .05s}
    #fullscreen-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;transition:opacity .4s}

    .zoom-control{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;height:150px;z-index:25;pointer-events:auto;opacity:0.28;transition:opacity .15s linear;padding:10px 8px;border-radius:16px}
    .zoom-control.near,.zoom-control:hover,.zoom-control:focus-within{opacity:1}
    .zoom-control svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:#fff;stroke-width:2;opacity:.9}
    .zoom-slider{writing-mode:vertical-lr;direction:rtl;width:3px;height:120px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.28);border-radius:2px;outline:none}
    .zoom-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)}

    .left-controls{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;z-index:30;gap:10px}
    .left-divider{width:20px;height:1px;background:rgba(255,255,255,.22);margin:2px 0;border:none;flex-shrink:0}
    .adjustments-with-reset{display:flex;flex-direction:row;align-items:center;gap:7px;position:relative}
    .adj-popup .row-top{gap:8px;min-height:24px}
    .adj-popup input[type=range]{margin-top:8px}
    .flash-group{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:5px;gap:2px;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.25)}
    .ctrl-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.10);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s ease,background-color .12s linear,color .12s linear;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .ctrl-btn:active{transform:scale(.9)}
    .ctrl-btn.active{background:#ffaa00;color:#000}
    .ctrl-btn svg{width:18px;height:18px}
    .filter-btn-lg{width:46px;height:46px}
    .filter-btn-lg svg{width:26px;height:26px;transform:rotate(180deg)}
    .ctrl-btn.is-modified{background:#ffaa00;color:#000}
    .flash-group .ctrl-btn{background:transparent}
    .flash-group .ctrl-btn.active{background:#ffaa00;color:#000}
    #color-btn .dot{width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
    #aspect-btn{width:40px;height:40px;border-radius:50%;font-size:11px;font-weight:700;letter-spacing:-.2px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12)}

    #settings-overlay{display:flex;position:fixed;inset:0;z-index:390;background:#0a0a0a;align-items:stretch;justify-content:stretch;padding:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s}
    #settings-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
    #settings-modal{width:100%;height:100%;min-height:0;max-height:none;background:#0a0a0a;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;overflow:hidden;transform:none}
    .settings-shell-head{height:62px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.1);background:#101012}
    .settings-shell-head strong{font-size:17px;font-weight:600}
    .settings-back{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .settings-back svg{width:18px;height:18px}
    .settings-content{display:flex;flex:1;min-height:0;overflow:hidden}
    body.settings-open #app > :not(#settings-overlay):not(#toast):not(#support-modal):not(.notice-modal){pointer-events:none!important}
    body.settings-open #settings-overlay{pointer-events:auto!important}
    .settings-nav{overflow-y:auto}
    .settings-body{overflow-y:auto}
    .settings-nav{width:230px;flex-shrink:0;padding:16px 12px;border-right:1px solid rgba(255,255,255,.1);background:#111113}
    .settings-nav-title{font-size:12px;color:rgba(255,255,255,.45);padding:4px 10px 10px;font-weight:500}
    .settings-nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:10px;background:transparent;color:rgba(255,255,255,.75);font-size:14px;font-weight:500;cursor:pointer;text-align:left;margin-bottom:4px}
    .settings-nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
    .settings-nav-item.active{background:rgba(255,255,255,.12);color:#fff}
    .settings-panel{display:none}
    .settings-panel.active{display:block}
    .settings-nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.9}
    .settings-body{flex:1;padding:18px 24px 24px;overflow-y:auto;min-width:0}
    .settings-body-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .settings-body-head h2{font-size:17px;font-weight:600}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    .settings-row:last-child{border-bottom:none}
    .settings-row .lab{font-size:14px;font-weight:500}
    .settings-row .hint{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}
    .settings-section-label{font-size:12px;font-weight:500;color:rgba(255,255,255,.45);padding:16px 0 6px;letter-spacing:.02em}

    .about-layout{display:flex;flex-direction:column;gap:18px;padding:26px 18px 20px;max-width:560px;margin:0 auto}
    .about-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
    .about-logo{width:92px;height:92px;margin-bottom:8px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));cursor:pointer;border-radius:28px;transition:box-shadow .55s ease,filter .35s ease,transform .15s ease}
    .about-logo:active{transform:scale(.95)}
    .about-logo.egg-active{animation:eggGlow 1.8s ease-in-out infinite}
    @keyframes eggGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
    .about-logo img{display:block;width:100%;height:100%}
    .about-brand-name{font-size:26px;font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere}
    .about-version{display:inline-block;font-size:12px;color:rgba(255,255,255,.62);padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}

    .about-actions{display:flex;flex-direction:row;justify-content:center;align-items:stretch;flex-wrap:wrap;gap:12px;width:100%}
    .about-action{flex:0 1 110px;width:110px;height:110px;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:22px;text-align:center;display:flex;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);color:#fff;text-decoration:none;font:inherit;cursor:pointer;transition:background .16s,border-color .16s,transform .12s}
    .about-action:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
    .about-action:active{transform:scale(.985)}
    .about-action .ico{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09)}
    .about-action .ico svg{width:22px;height:22px}
    .about-action .txt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;flex:0 0 auto}
    .about-action .txt b{font-size:12px;line-height:1.2;font-weight:600}
    .about-action .txt small,.about-action .chev{display:none}
    .about-action.primary{background:linear-gradient(135deg,rgba(255,170,0,.24),rgba(255,120,0,.12));border-color:rgba(255,170,0,.45)}
    .about-action.primary:hover{background:linear-gradient(135deg,rgba(255,170,0,.34),rgba(255,120,0,.18));border-color:rgba(255,190,50,.7)}
    .about-action.primary .ico{background:#ffaa00;color:#1a1200}

    .switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0}
    .switch input{opacity:0;width:0;height:0}
    .switch-slider{position:absolute;cursor:pointer;inset:0;border-radius:26px;background:rgba(255,255,255,.2);transition:.2s}
    .switch-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;border-radius:50%;background:#fff;transition:.2s}
    .switch input:checked + .switch-slider{background:#ffaa00}
    .switch input:checked + .switch-slider:before{transform:translateX(18px)}

    .storage-card{padding:6px 2px 4px}
    .storage-pct{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px;color:#ffaa00}
    .storage-track{height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
    .storage-fill{height:100%;width:0;border-radius:8px;background:#ffaa00;transition:width .45s cubic-bezier(.2,.8,.2,1)}
    .storage-detail{margin-top:12px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.68);font-variant-numeric:tabular-nums}
    .storage-clean{margin-top:14px;padding:9px 20px;border:0;border-radius:10px;background:#ffaa00;color:#000;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
    .storage-sep{height:1px;background:rgba(255,255,255,.1);margin:20px 0 18px}
    .storage-sub{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
    .storage-files{display:flex;flex-direction:column;gap:10px}
    .storage-empty{font-size:13px;color:rgba(255,255,255,.5);padding:6px 2px}
    .storage-file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.04)}
    .storage-file .sf-cover{flex:0 0 56px;width:56px;height:56px;border-radius:10px;overflow:hidden;background:#000;position:relative}
    .storage-file .sf-cover img,.storage-file .sf-cover video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .storage-file .sf-name{flex:1;min-width:0;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .storage-file .sf-size{flex:0 0 auto;font-size:13px;font-weight:600;color:#ffaa00;font-variant-numeric:tabular-nums}
    .storage-file .sf-actions{flex:0 0 auto;display:flex;gap:8px}
    .storage-file .sf-actions button{padding:7px 12px;border-radius:9px;border:1px solid transparent;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
    .storage-file .sf-actions .sf-del{border-color:rgba(255,59,48,.5);background:rgba(255,59,48,.16);color:#ff6b63}
    .storage-file .sf-actions .sf-view{background:#ffaa00;color:#000}

    .settings-row select{min-width:140px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#2c2c2e;color:#fff;font-size:13px;outline:none;cursor:pointer;color-scheme:dark}
    .settings-row select option{background:#2c2c2e;color:#fff}

    .popup-menu{display:none;position:fixed;z-index:60;background:rgba(28,28,30,.95);border-radius:14px;padding:8px 12px;box-shadow:0 8px 28px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1)}
    .popup-menu.show{display:block}

    #color-palette{display:flex;position:fixed;z-index:60;flex-direction:column;gap:12px;background:rgba(30,30,32,.92);border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.16);min-width:160px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-8px);transition:opacity .18s ease,visibility .18s,transform .18s ease}
    #color-palette.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;color:#fff;padding:0 2px 2px}
    .panel-head .close-x{width:28px;height:28px;border:none;border-radius:50%;background:transparent;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
    .color-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px;justify-items:center}
    .color-swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s ease;box-shadow:0 1px 4px rgba(0,0,0,.25)}
    .color-swatch:hover,.color-swatch.selected{border-color:#fff;transform:scale(1.08)}
    .custom-color-toggle{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:36px;padding:8px 10px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:12px;cursor:pointer}
    #custom-color-picker{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
    #custom-color-dot{display:inline-block;width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35)}

    #filter-panel{display:flex;position:fixed;z-index:60;flex-direction:column;gap:12px;background:rgba(30,30,32,.92);border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.16);width:196px;max-height:calc(100vh - 24px);opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-8px);transition:opacity .18s ease,visibility .18s,transform .18s ease}
    #filter-panel.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}
    .filter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 10px;align-content:start;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
    .filter-amount{flex:none;margin:0 -16px -16px;padding:12px 16px 14px;border-top:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:0 0 18px 18px}
    .filter-amount-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:500;color:rgba(255,255,255,.75);margin-bottom:8px}
    #filter-amount-val{font-variant-numeric:tabular-nums;color:#ffaa00}
    #filter-amount{display:block;width:100%;height:14px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
    #filter-amount:disabled{opacity:.4;cursor:default}
    #filter-amount::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,#ffaa00 var(--p,100%),rgba(255,255,255,.22) var(--p,100%))}
    #filter-amount::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:#fff}
    .filter-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:none;background:transparent;color:#fff;padding:0}
    .filter-item .thumb{width:68px;height:68px;border-radius:14px;border:2px solid transparent;overflow:hidden;transition:transform .1s ease}
    .filter-item.selected .thumb,.filter-item:hover .thumb{border-color:#fff;transform:scale(1.03)}
    .filter-item .fname{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:rgba(255,255,255,.75);font-weight:500}

    #timer-menu{display:flex;position:fixed;z-index:60;flex-direction:column;gap:12px;background:rgba(30,30,32,.92);border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.16);min-width:160px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-8px);transition:opacity .18s ease,visibility .18s,transform .18s ease}
    #timer-menu.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}
    .timer-list{display:flex;flex-direction:column;gap:8px}
    .timer-opt{min-height:36px;padding:8px 12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:500;border-radius:10px;cursor:pointer;text-align:center;white-space:nowrap}

  <div class="app-loading-inner">
    <div class="app-loading-track"><div class="app-loading-progress" id="app-loading-progress"></div></div>
    <div class="app-loading-label" id="app-loading-label">Đang thiết lập...</div>
  </div>
</div>
<script>
(function(){
  var screen=document.getElementById('app-loading'),
      bar=document.getElementById('app-loading-progress'),
      label=document.getElementById('app-loading-label');
  var shown=0,target=8,done=false,timer=null,safety=null;
  function paint(){ if(bar) bar.style.width=shown.toFixed(1)+'%'; }
  function step(){
    if(done) return;
    var ceiling=target>=100?100:Math.min(96,target+10);
    if(shown<target) shown+=Math.max(0.5,(target-shown)*0.2);
    else if(shown<ceiling) shown+=0.12;
    if(shown>ceiling) shown=ceiling;
    paint();
  }
  function remove(){ if(screen&&screen.parentNode) screen.parentNode.removeChild(screen); }
  window.AppLoading={
    set:function(pct,text){
      if(done) return;
      if(typeof pct==='number'&&pct>target) target=Math.min(100,pct);
      if(text&&label) label.textContent=text;
    },
    finish:function(){
      if(done) return; done=true;
      clearInterval(timer); clearTimeout(safety);
      shown=100; paint();
      setTimeout(function(){
        if(!screen) return;
        screen.classList.add('done');
        screen.addEventListener('transitionend',remove,{once:true});
        setTimeout(remove,1000);
      },600);
    }
  };
  if(!screen||!bar) return;
  paint();
  timer=setInterval(step,40);
  safety=setTimeout(function(){ window.AppLoading.finish(); },60000);
  window.addEventListener('error',function(){ setTimeout(function(){ if(!done&&target<30) window.AppLoading.finish(); },4000); });
})();
</script>
